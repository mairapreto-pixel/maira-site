name: Publicar o site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: publicar
  cancel-in-progress: true

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pillow

      # Baixa só as fotos que ainda não estão no repositório e guarda as versões do site.
      - name: Fotos
        run: python ferramentas/baixar_fotos.py

      - name: Guardar fotos novas no repositório
        run: |
          git config user.name "publicacao"
          git config user.email "publicacao@users.noreply.github.com"
          git add fotos
          git diff --cached --quiet || (git commit -m "Fotos do site" && git push)

      - name: Gerar páginas
        run: python build.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publicar:
    needs: gerar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
